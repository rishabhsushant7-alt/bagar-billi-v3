<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Bagar Billi v3 🐱</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#0f0f0f;color:#fff;min-height:100vh}
#login{height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;padding:20px}
.card{background:#1c1c1c;border-radius:18px;padding:22px;width:100%;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
input,button{width:100%;padding:12px 14px;border-radius:12px;border:0;outline:none}
input{background:#2a2a2a;color:#fff;margin:6px 0}
button{background:#ffbf00;color:#000;font-weight:800;cursor:pointer;margin-top:10px}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#1a1a1a;border-bottom:1px solid #2a2a2a}
.layout{display:flex;height:calc(100vh - 52px)}
.side{width:95px;background:#151515;border-right:1px solid #252525;display:flex;flex-direction:column;gap:6px;padding:10px}
.side button{background:#232323;color:#fff;font-size:12px;padding:10px}
.side button.active{background:#ffbf00;color:#000}
.main{flex:1;display:flex;flex-direction:column}
.list{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.item{background:#1e1e1e;padding:10px;border-radius:12px;cursor:pointer;display:flex;gap:8px;align-items:center}
.chat{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#111}
.bubble{max-width:78%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.3}
.me{align-self:flex-end;background:#ffbf00;color:#000;border-bottom-right-radius:4px}
.other{align-self:flex-start;background:#222;border-bottom-left-radius:4px}
.bar{display:flex;gap:8px;padding:10px;background:#1a1a1a}
.bar input{flex:1}
.bar button{width:auto;padding:12px 18px}
.hidden{display:none}
.tag{font-size:10px;background:#333;padding:2px 6px;border-radius:20px}
</style>
</head>
<body>
<div id="login">
<h1>🐱 Bagar Billi v3</h1><p style="opacity:.6">Gali ki Billi ka Adda</p>
<div class="card">
<input id="lu" placeholder="username (a-z, 0-9, _)"/>
<input id="lp" type="password" placeholder="password"/>
<button onclick="doAuth()">Login / Signup Meow 😸</button>
<div id="lerr" style="color:#ff6b6b;margin-top:8px;font-size:13px"></div>
</div>
</div>
<div id="app" class="hidden">
<div class="top"><div><b id="myName">billi</b> <span id="myLevel" class="tag">...</span></div><button onclick="logout()" style="width:auto;background:#333;color:#fff;padding:6px 12px;font-size:12px">Logout</button></div>
<div class="layout">
<div class="side">
<button id="b-chats" class="active" onclick="tab('chats')">Chats</button>
<button id="b-online" onclick="tab('online')">Online</button>
<button id="b-users" onclick="tab('users')">Search</button>
<button id="b-groups" onclick="tab('groups')">Groups</button>
<button id="b-game" onclick="tab('game')">Game</button>
<button id="b-leader" onclick="tab('leader')">Top</button>
</div>
<div class="main">
<div id="pane-chats" class="list"></div>
<div id="pane-online" class="list hidden"></div>
<div id="pane-users" class="list hidden"><input id="uq" placeholder="Username search..." oninput="searchUsers()"/><div id="ures"></div></div>
<div id="pane-groups" class="list hidden"><div style="display:flex;gap:6px"><input id="gname" placeholder="New group name"/><button onclick="createGroup()" style="width:auto">Create</button></div><input id="gq" placeholder="Search groups..." oninput="listGroups()" style="margin-top:8px"/><div id="gres"></div></div>
<div id="pane-game" class="list hidden"><button onclick="createGame()">🎲 Create Truth & Dare Room</button><div style="display:flex;gap:6px;margin-top:8px"><input id="gcode" placeholder="Room code"/><button onclick="joinGame()" style="width:auto">Join</button></div><div id="gamestate" style="margin-top:12px;background:#1e1e1e;padding:12px;border-radius:12px"></div></div>
<div id="pane-leader" class="list hidden"><div id="leaderboard"></div></div>
<div id="chatWrap" class="hidden" style="display:flex;flex-direction:column;flex:1;border-top:1px solid #252525"><div id="chatHead" style="padding:8px 12px;background:#1a1a1a;font-weight:700"></div><div id="chatMsgs" class="chat"></div><div class="bar"><input id="msgIn" placeholder="Message... /joke /roast etc" onkeydown="if(event.key==='Enter')sendMsg()"/><button onclick="sendMsg()">Bhej</button></div></div>
</div>
</div>
</div>
<script>
let token=localStorage.getItem('bb_token')||'', me='', curKind='', curTarget='', poll=null;
function api(p,opt={}){opt.headers=opt.headers||{};if(token)opt.headers['X-Token']=token;if(opt.body&&typeof opt.body!=='string')opt.body=JSON.stringify(opt.body),opt.headers['Content-Type']='application/json';return fetch(p,opt).then(r=>r.json().then(j=>{if(r.status===401){logout();throw 'login'}return j}))}
function doAuth(){let u=document.getElementById('lu').value.trim().toLowerCase(), p=document.getElementById('lp').value;if(!u||!p){document.getElementById('lerr').innerText='Username / password likh';return}fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})}).then(r=>r.json().then(j=>{if(j.error){document.getElementById('lerr').innerText=j.error;return}token=j.token;localStorage.setItem('bb_token',token);boot()}))}
function boot(){if(!token){return}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');api('/api/me').then(r=>{me=r.username;document.getElementById('myName').innerText=r.username;document.getElementById('myLevel').innerText=r.level+' • '+r.msgs+' msgs'});tab('chats');loadChats();clearInterval(poll);poll=setInterval(()=>{if(curTarget)loadMsgs();else if(document.getElementById('pane-chats').offsetParent)loadChats()},2500)}
function logout(){localStorage.removeItem('bb_token');token='';location.reload()}
function tab(t){['chats','online','users','groups','game','leader'].forEach(x=>{document.getElementById('pane-'+x).classList.add('hidden');document.getElementById('b-'+x).classList.remove('active')});document.getElementById('pane-'+t).classList.remove('hidden');document.getElementById('b-'+t).classList.add('active');if(t==='chats')loadChats();if(t==='online')loadOnline();if(t==='groups')listGroups();if(t==='leader')loadLeader()}
function loadChats(){api('/api/chats').then(r=>{let h='';r.chats.forEach(c=>{h+=`<div class="item" onclick="openChat('dm','${c.user}')"><div style="width:36px;height:36px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center">🐱</div><div><b>${c.user}</b> ${c.online?'🟢':''}<br><small>${c.last}</small></div></div>`});if(!r.chats.length)h='<small style="opacity:.5">Koi chat nahi, Search me jaake kisi ko dhundo</small>';document.getElementById('pane-chats').innerHTML=h})}
function loadOnline(){api('/api/online').then(r=>{let h='';r.users.forEach(u=>{h+=`<div class="item" onclick="openChat('dm','${u.username}')"><b>${u.username}</b> <span class="tag">${u.level}</span></div>`});document.getElementById('pane-online').innerHTML=h||'<small>koi online nahi</small>'})}
function searchUsers(){let q=document.getElementById('uq').value.trim();if(q.length<2)return;api('/api/users?q='+encodeURIComponent(q)).then(r=>{let h='';r.users.forEach(u=>{h+=`<div class="item" onclick="openChat('dm','${u.username}')"><b>${u.username}</b> <span class="tag">${u.level}</span> <small>${u.bio||''}</small></div>`});document.getElementById('ures').innerHTML=h})}
function listGroups(){let q=document.getElementById('gq').value||'';api('/api/groups?q='+encodeURIComponent(q)).then(r=>{let h='';r.groups.forEach(g=>{h+=`<div class="item"><b>${g.name}</b> <span class="tag">${g.members} members</span> <button style="width:auto;margin-left:auto" onclick="${g.joined?`openChat('g','${g.id}')`:`joinG(${g.id})`}">${g.joined?'Open':'Join'}</button></div>`});document.getElementById('gres').innerHTML=h})}
function createGroup(){let n=document.getElementById('gname').value.trim();if(!n)return;api('/api/group/create',{method:'POST',body:{name:n}}).then(()=>{document.getElementById('gname').value='';listGroups()})}
function joinG(id){api('/api/group/join',{method:'POST',body:{id}}).then(()=>listGroups())}
function openChat(kind,target){curKind=kind;curTarget=target;document.getElementById('chatWrap').classList.remove('hidden');document.getElementById('chatHead').innerText=(kind==='g'?'Group #':'@')+target;document.getElementById('chatMsgs').innerHTML='';loadMsgs()}
let lastAfter=0;
function loadMsgs(){api(`/api/msgs?kind=${curKind}&target=${curTarget}&after=${lastAfter}`).then(r=>{let box=document.getElementById('chatMsgs');r.msgs.forEach(m=>{if(document.getElementById('m-'+m.id))return;let d=document.createElement('div');d.id='m-'+m.id;d.className='bubble '+(m.sender===me?'me':'other');let rp=m.reply?`<div style="font-size:11px;opacity:.7;border-left:2px solid #ffbf00;padding-left:6px;margin-bottom:4px">${m.reply}</div>`:'';let txt=m.deleted?'🚫 deleted':(m.text||'');if(m.img)txt+=`<br><img src="${m.img}" style="max-width:100%;border-radius:10px;margin-top:6px"/>`;d.innerHTML=rp+`<small style="opacity:.6">${m.sender}</small><br>${txt}`;box.appendChild(d);lastAfter=Math.max(lastAfter,m.id)});box.scrollTop=box.scrollHeight})}
function sendMsg(){let t=document.getElementById('msgIn').value.trim();if(!t)return;document.getElementById('msgIn').value='';api('/api/send',{method:'POST',body:{kind:curKind,target:curTarget,text:t}}).then(()=>loadMsgs())}
function loadLeader(){api('/api/leaderboard').then(r=>{let h='<b>🔥 Tap Leaderboard</b><br>';r.taps.forEach((x,i)=>h+=`${i+1}. ${x.user} - ${x.n}<br>`);h+='<br><b>💬 Chat Kings</b><br>';r.chat.forEach((x,i)=>h+=`${i+1}. ${x.user} - ${x.n} msgs<br>`);document.getElementById('leaderboard').innerHTML=h})}
function createGame(){api('/api/game/create',{method:'POST'}).then(r=>showGame(r))}
function joinGame(){let c=document.getElementById('gcode').value.trim();if(!c)return;api('/api/game/join',{method:'POST',body:{code:c}}).then(r=>showGame(r))}
function showGame(s){let h=`Code: <b>${s.code}</b><br>Players: ${s.players.join(', ')}<br>Phase: ${s.phase}<br>Turn: ${s.players[s.turn]||''}<br>`;if(s.question)h+=`<br>Q: ${s.question} (${s.mode})<br><button onclick="actGame('next')">Next Turn</button>`;else h+=`<br><button onclick="actGame('truth')">Truth</button> <button onclick="actGame('dare')">Dare</button> <button onclick="actGame('start')">Start</button>`;h+=`<br><br>Log: ${s.log.join('<br>')}`;document.getElementById('gamestate').innerHTML=h;window._gcode=s.code}
function actGame(act){if(!window._gcode)return;api('/api/game/act',{method:'POST',body:{code:window._gcode,action:act}}).then(r=>showGame(r))}
boot();
</script>
</body>
</html>
